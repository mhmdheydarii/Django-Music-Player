{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="{% static 'css/authstyle.css' %}">
</head>

<body>
    <div class="container">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}" {% endif %}>{{ message }}</li>
                {% endfor %}
        </ul>
        {% endif %}
        <h2>Change Password</h2>
        <!-- Change Password Form -->
        <form method="post">
            {% csrf_token %}
            <div class="form active">
                <input type="password" name="old_password" placeholder="Old Password">
                <input type="password" name="new_password1" placeholder="New Password">
                <input type="password" name="new_password2" placeholder="New Password">
                <button class="btn" type="submit">Change</button>
            </div>
        </form>
        <script src="{% static 'js/authscript.js'%}"></script>
    </div>
</body>

</html>
