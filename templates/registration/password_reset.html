{% extends 'registration/base.html' %}
{% block content %}
<!-- Forgot Password Form -->
<form method="post">
    {% csrf_token %}
    <div id="forgot-password" class="form active">
        <input type="email" name="email" placeholder="Your Email">
        <button class="btn" type="submit">Send Email</button>
    </div>
</form>
</div>
{% endblock %}
